<!-- Configuração centralizada do grupo "default" -->

<!-- Só para agentes Linux: log JSON da API do lab -->
<agent_config os="Linux">
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/lab-api/api.log</location>
  </localfile>
</agent_config>

<!-- Só para agentes Windows: Sysmon (processos, rede, registro) e PowerShell (4104) -->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
